name: Axion DB Schema

on:
  push:
    paths:
      - 'axion-database-schem/*.sql'
      - '.github/workflows/axion-db-schema.yml'
  workflow_dispatch:

jobs:
  apply-schema:
    runs-on: ubuntu-latest

    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGSSLMODE: require
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_POSTGRES_SERVER_NAME: ${{ secrets.AZURE_POSTGRES_SERVER_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Allow pgcrypto extension on Azure PostgreSQL
        if: ${{ env.AZURE_RESOURCE_GROUP != '' && env.AZURE_POSTGRES_SERVER_NAME != '' }}
        run: |
          az postgres flexible-server parameter set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server-name "$AZURE_POSTGRES_SERVER_NAME" \
            --name azure.extensions \
            --value PGCRYPTO

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply schema files in order
        working-directory: ./axion-database-schem
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          DB_NAME="${PGDATABASE:-axiondb}"

          echo "Checking database: $DB_NAME"
          if ! psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME'" | grep -q 1; then
            echo "Database $DB_NAME does not exist. Creating it..."
            createdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "$DB_NAME"
          fi

          for f in ./*.sql; do
            echo "Executing: $f"
            psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -f "$f"
          done
