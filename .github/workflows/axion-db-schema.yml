name: Axion DB Schema

on:
  push:
    paths:
      - 'axion-database-schema/*.sql'
      - '.github/workflows/axion-db-schema.yml'
  workflow_dispatch:

jobs:
  apply-schema:
    runs-on: ubuntu-latest

    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGSSLMODE: require

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply schema files in order
        working-directory: ./axion-database-schema
        shell: bash
        run: |
          set -euo pipefail

          for f in $(ls *.sql | sort); do
            echo "Executing: $f"
            psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -f "$f"
          done
